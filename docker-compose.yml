services:
  backend:
    build: ./backend
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    environment:
      - ENV=${ENV:-prod}
      - DATABASE_URL=sqlite:////app/data/lorestudio.db
      - SNAPSHOTS_PATH=/app/data/snapshots
      - UPLOADS_PATH=/app/data/uploads
      - BACKUPS_PATH=/app/data/backups
      # Both are required: the backend refuses defaults when ENV=prod.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-1.0}
      - SEED_DEMO=${SEED_DEMO:-true}
      - TZ=${TZ:-America/Los_Angeles}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: lorestudio
