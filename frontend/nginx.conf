# A template: API_UPSTREAM (default backend:8000) is filled in when the container starts
# (nginx's own templates step; nginx variables like $host are left alone). The all-in-one
# fills it with 127.0.0.1:8000.
server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (images, imports) and long Assistant replies.
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Hashed by Vite: a new build is a new name, so they can be kept for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The SPA: every route is index.html, which must never be cached or an update is missed.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }

    # The API. Streams (Assistant replies, job progress) must not be buffered, and a long
    # reply from a slow local model must not time out.
    location /api/ {
        proxy_pass http://${API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
