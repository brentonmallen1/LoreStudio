[package]
name = "lorestudio-desktop"
version = "2026.10.3"
description = "LoreStudio on the desktop: the app's own window over its own backend"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
getrandom = "0.4"
serde_json = "1" # tauri::generate_handler! names it
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# The Save dialog for exports, shown from the download hook (on the main thread, so the
# blocking dialog, not tauri-plugin-dialog's, which must not block it).
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[profile.release]
strip = true
lto = true
