version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-jsx-a11y (6.10) supports ESLint 9 at most. Lift this when it supports 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1. Lift this when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # The desktop app (desktop/): Tauri's CLI and the Rust shell.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop-npm:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      desktop-cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    # / holds Dockerfile.aio.
    directories: [/, /backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Python minor bumps change the interpreter the lockfile was resolved for and often
      # precede wheel availability (spaCy, numpy). Take them deliberately, not automatically.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
