version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    # / holds Dockerfile.aio.
    directories: [/, /backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Python minor bumps change the interpreter the lockfile was resolved for and often
      # precede wheel availability (spaCy, numpy). Take them deliberately, not automatically.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
