# Runs the same checks as `just ci`, on every PR and on main. The job names
# (gates / backend / frontend / dependency-review) are meant to be the required
# status checks on the main branch ruleset; renaming one silently removes its
# gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Personal data
        run: python3 scripts/check-pii.py
      - name: File-length budget
        run: python3 scripts/check-size.py
      - name: Design-token budget
        run: python3 scripts/check-tokens.py
      - name: Tracked documents
        run: python3 scripts/check-docs.py

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install pandoc
        # Export's docx/epub/odt round-trip tests skip without it — five tests, and the
        # export path they cover, silently untested here while they ran locally.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Install dependencies
        # Python comes from backend/.python-version (3.13, the Docker base). Unpinned, uv
        # took the newest the lockfile allowed — 3.14 — and CI measured coverage on an
        # interpreter nothing ships on.
        run: uv sync --frozen --all-groups
      - name: Lint (ruff)
        run: |
          uv run ruff check app/ tests/ scripts/
          uv run ruff format --check app/ tests/ scripts/
      - name: Type check (ty)
        run: uv run ty check app/
      - name: Tests (pytest + coverage ratchet)
        run: uv run python -m pytest -q --cov
      - name: Migrations match models
        run: uv run python -m pytest -q tests/test_migrations.py
      - name: Generated files are current
        run: uv run python scripts/gen_ai_features.py --check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format (prettier)
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm run test:coverage
      - name: Build
        run: npm run build

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    # Needs GitHub Advanced Security on a private repository; without it the action fails
    # every pull request, which turned every Dependabot PR red for a reason unrelated to
    # the code. Skipped while private, and back on its own if the repository goes public.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
