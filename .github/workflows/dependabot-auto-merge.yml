# Merge Dependabot's minor/patch groups once CI has passed on them. Everything else —
# majors, the actions group, base images — waits for a person.
#
# This used to run `gh pr merge --auto` on the pull_request event. --auto waits only for
# *required* checks, and a private repository on GitHub Free cannot require any (branch
# protection and rulesets need Pro), so it merged at once: #16 and #21 landed with the
# backend job red. CI's own completion is the gate this plan allows, and the merge names
# the exact commit CI tested, so a later push cannot ride in on an earlier green run.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      contains(github.event.workflow_run.head_branch, 'minor-patch')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request CI just passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$SHA"
